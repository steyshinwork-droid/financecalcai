name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "Supabase ping status: %{http_code}\n" \
            "https://ocnxetcjqaqagakeieev.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_bTByhnnUXWBxd-bli8sPQg_1fQuYnyu"
